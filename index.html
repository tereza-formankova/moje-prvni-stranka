<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Text v záložce prohlížeče: -->
  <title>Moje první stránka</title>
  <style>
    :root {
      --nebe: #dceefb;
      --inkoust: #13294b;
      --zelena: #1f8a5b;
      --bila: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--nebe);
      color: var(--inkoust);
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
      line-height: 1.6;
    }
    main {
      max-width: 560px;
      background: var(--bila);
      padding: 40px 32px;
      border-radius: 20px;
      border-left: 10px solid var(--zelena);
    }
    h1 {
      font-size: clamp(2rem, 6vw, 2.8rem);
      line-height: 1.15;
      margin: 0 0 16px;
    }
    p { margin: 0 0 12px; font-size: 1.1rem; }
    .razitko {
      display: inline-block;
      margin-top: 12px;
      padding: 6px 14px;
      border-radius: 999px;
      background: var(--zelena);
      color: var(--bila);
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main>
    <!-- Tady si můžete přepsat nadpis: -->
    <h1>Ahoj, vítejte u mě na stránce!</h1>

    <!-- Tady si můžete přepsat text: -->
    <p>Tuhle stránku jsem zveřejnila na internetu úplně sama, přes GitHub.</p>
    <p>Je to můj první krok k vlastnímu projektu.</p>

    <span class="razitko">Funguje to ✓</span>
  </main>
</body>
</html>
